<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penilaian | Tiketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="index.html"><i class="bi bi-airplane-fill"></i> Tiketing</a>
</div></nav>

<main class="wrap blok">
  <h2 class="judul">Mode penilaian</h2>
  <p class="sub">Log proses terakhir dari halaman utama dan isi linked list pesanan.</p>

  <div class="log-grid">
    <div><h3><i class="bi bi-search"></i> Log pencarian (linear search)</h3><pre id="logCari"></pre></div>
    <div><h3><i class="bi bi-sort-numeric-down"></i> Log pengurutan (bubble sort)</h3><pre id="logUrut"></pre></div>
  </div>

  <h3 class="blok"><i class="bi bi-diagram-3"></i> Linked list pesanan</h3>
  <div id="rantai" class="rantai"></div>

  <p class="blok"><a class="btn btn-navy" href="index.html"><i class="bi bi-arrow-left"></i> Kembali</a></p>
</main>

<script src="app.js"></script>
<script>
  let l = {};
  try { l = JSON.parse(sessionStorage.getItem("log") || "{}"); } catch (e) {}
  document.getElementById("logCari").textContent =
    (l.cari || ["Belum ada pencarian. Lakukan pencarian di halaman utama."]).join("\n");
  document.getElementById("logUrut").textContent =
    (l.urut || ["Belum ada pengurutan. Klik urutkan di halaman utama."]).join("\n");

  // Telusuri linked list: head -> node -> ... -> null
  let html = `<span class="ujung">head</span>`;
  let bantu = riwayat.head;
  while (bantu !== null) {
    html += `<span class="panah">→</span><div class="node">${bantu.data.kode}<br>${bantu.data.judul}</div>`;
    bantu = bantu.next;
  }
  html += `<span class="panah">→</span><span class="ujung">null</span>`;
  document.getElementById("rantai").innerHTML = html;
</script>
</body>
</html>
