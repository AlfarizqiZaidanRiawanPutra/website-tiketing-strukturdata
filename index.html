<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiketing | Tiket Pesawat dan Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav><div class="wrap">
  <a class="logo" href="index.html"><i class="bi bi-airplane-fill"></i> Tiketing</a>
  <ul>
    <li><a href="#destinasi">Destinasi</a></li>
    <li><a href="#hasil">Pesan</a></li>
    <li><a href="#pesanan">Pesanan saya</a></li>
  </ul>
</div></nav>

<header class="hero"><div class="wrap">
  <h1>Terbang lebih jauh, <span>Jelajahi</span> lebih seru</h1>
  <p>Pesan tiket pesawat dan hotel favorit Anda dalam satu tempat.</p>
</div></header>

<section class="wrap cari">
  <div class="tab">
    <button class="aktif" data-jenis="penerbangan"><i class="bi bi-airplane"></i> Pesawat</button>
    <button data-jenis="hotel"><i class="bi bi-building"></i> Hotel</button>
  </div>
  <div class="cari-form">
    <div id="asalBox"><label for="asal">Dari</label><input id="asal" value="Surabaya" readonly></div>
    <div><label id="lblKata" for="kata">Ke</label><input id="kata" placeholder="Kota tujuan"></div>
    <button class="btn btn-navy" id="btnCari"><i class="bi bi-search"></i> Cari</button>
  </div>
</section>

<main class="wrap">
  <section class="blok" id="destinasi">
    <h2 class="judul">Destinasi populer</h2>
    <div class="dest-grid">
      <button class="dest" data-kota="Bali"><div class="foto" style="--foto:url('img/bali.jpg')"></div><b>Bali</b></button>
      <button class="dest" data-kota="Jakarta"><div class="foto" style="--foto:url('img/jakarta.jpg')"></div><b>Jakarta</b></button>
      <button class="dest" data-kota="Medan"><div class="foto" style="--foto:url('img/medan.jpg')"></div><b>Medan</b></button>
      <button class="dest" data-kota="Yogyakarta"><div class="foto" style="--foto:url('img/yogyakarta.jpg')"></div><b>Yogyakarta</b></button>
      <button class="dest" data-kota="Lombok"><div class="foto" style="--foto:url('img/lombok.jpg')"></div><b>Lombok</b></button>
    </div>
  </section>

  <section class="blok" id="hasil">
    <div class="judul-bar">
      <h2 class="judul" id="judulHasil">Penerbangan tersedia</h2>
      <button class="btn btn-soft" id="btnUrut"><i class="bi bi-sort-numeric-down"></i> Harga termurah</button>
    </div>
    <div id="daftar"></div>
  </section>

  <section class="blok" id="pesanan" hidden>
    <div class="judul-bar">
      <h2 class="judul">Pesanan saya</h2>
      <button class="btn btn-bahaya" id="btnHapusBatal" hidden><i class="bi bi-trash"></i> Hapus yang dibatalkan</button>
    </div>
    <div id="daftarPesanan"></div>
  </section>
</main>

<footer><div class="wrap">© 2026 Tiketing · <a href="penilaian.html">Penilaian</a></div></footer>

<dialog id="dlg">
  <form id="form">
    <h3 id="dlgJudul"></h3>
    <p class="sub" id="dlgRingkas"></p>
    <label for="nama">Nama lengkap</label>
    <input id="nama" required>
    <label for="email">Email</label>
    <input id="email" type="email" required>
    <label for="jumlah" id="lblJumlah">Jumlah</label>
    <input id="jumlah" type="number" min="1" max="10" value="1" required>
    <label for="metode">Metode pembayaran</label>
    <select id="metode"><option>Transfer bank</option><option>E-wallet</option><option>Kartu kredit</option></select>
    <div class="total">Total <b id="total"></b></div>
    <div class="aksi">
      <button type="button" class="btn btn-soft" id="btnBatal">Batal</button>
      <button class="btn btn-kuning"><i class="bi bi-credit-card"></i> Bayar dan pesan</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
<script src="beranda.js"></script>
</body>
</html>
